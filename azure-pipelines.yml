trigger:
- main

pool:
  name: My  # Your self-hosted agent

variables:
  solution: '**/*.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'
  siteFolder: 'C:\sites\speedy-order'

steps:

# Step 1: Restore NuGet packages
- task: NuGetToolInstaller@1

- task: NuGetCommand@2
  inputs:
    restoreSolution: '$(solution)'

# Step 2: Build the project
- task: VSBuild@1
  inputs:
    solution: '$(solution)'
    msbuildArgs: '/p:Configuration=$(buildConfiguration)'
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'

# Step 3: Stop IIS site before deploying
- powershell: |
    Import-Module WebAdministration
    Stop-Website -Name "speedy-order"
  displayName: 'Stop IIS Website'

# Step 4: Clean the existing IIS directory
- powershell: |
    Write-Host "Cleaning existing site folder: $(siteFolder)"
    Remove-Item -Path "$(siteFolder)\*" -Recurse -Force -ErrorAction SilentlyContinue
  displayName: 'Clean IIS Folder'

# Step 5: Copy updated code to IIS directory
- task: CopyFiles@2
  inputs:
    SourceFolder: '$(Build.SourcesDirectory)'
    Contents: '**\*'
    TargetFolder: '$(siteFolder)'
  displayName: 'Copy new site files to IIS folder'

# Step 6: Add WebForm1.aspx to IIS Default Documents
- powershell: |
    Import-Module WebAdministration

    $siteName = "speedy-order"
    $defaultDocPath = "IIS:\Sites\$siteName\defaultDocument\files"

    # Get existing default documents
    $existingDefaults = Get-WebConfigurationProperty -pspath "IIS:\Sites\$siteName" -filter "system.webServer/defaultDocument/files" -name "." | Select-Object -ExpandProperty value

    # Optional: Clear all existing default documents (uncomment the next 3 lines if you want WebForm1.aspx to be the only one)
    # Clear-WebConfiguration -pspath "IIS:\Sites\$siteName" -filter "system.webServer/defaultDocument/files"
    # Write-Host "Cleared existing default documents"
    # Add-WebConfigurationProperty -pspath "IIS:\Sites\$siteName" -filter "system.webServer/defaultDocument/files" -name "." -value @{value="WebForm1.aspx"}

    # If WebForm1.aspx is not already in the list, add it
    if ($existingDefaults -notcontains "WebForm1.aspx") {
        Add-WebConfigurationProperty -pspath "IIS:\Sites\$siteName" -filter "system.webServer/defaultDocument/files" -name "." -value @{value="WebForm1.aspx"}
        Write-Host "Added WebForm1.aspx to Default Documents"
    } else {
        Write-Host "WebForm1.aspx is already in the Default Documents list"
    }
  displayName: 'Add WebForm1.aspx to IIS Default Documents'

# Step 7: Start the IIS site again
- powershell: |
    Import-Module WebAdministration
    Start-Website -Name "speedy-order"
  displayName: 'Start IIS Website'
